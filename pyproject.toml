[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-maintainer-audit"
version = "0.1.0"
description = "Audit an open-source repository for sustainable maintenance practices."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ian0609666" }
]
keywords = ["open-source", "maintenance", "audit", "github", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
oss-maintainer-audit = "oss_maintainer_audit.cli:main"

[project.urls]
Homepage = "https://github.com/ian0609666/20261018"
Issues = "https://github.com/ian0609666/20261018/issues"

[tool.setuptools.packages.find]
where = ["src"]
