name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What maintainer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Add example commands, output, or repositories when useful.
